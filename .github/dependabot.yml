# Version updates for the Bun dependencies and the SHA-pinned workflow actions.
# A release must be two weeks old before Dependabot proposes it
# (the rule is in ADR 0015, these settings in ADR 0016).
# Minor and patch updates are grouped; each major update gets its own pull request, so one breaking
# release does not hold back the others.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
